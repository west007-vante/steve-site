<!doctype html>
<html lang="pt-BR" data-base="..">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diagnóstico — STEVE</title>
  <meta name="description" content="Onze perguntas. Você sai com um diagnóstico de verdade: onde a empresa perde tempo, o que o Steve faria primeiro e o preço pela escada.">
  <link rel="icon" href="../assets/S.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
  <style>
    body { overflow: hidden; height: 100dvh; }
    .hd { position: absolute; }
    .split { display: grid; grid-template-columns: 45% 55%; height: 100dvh; }
    .painel { position: relative; background: var(--chumbo-2); overflow: hidden; display: grid; grid-template-rows: 1fr auto; padding: 0 0 40px; }
    .painel .retrato { position: absolute; inset: 0; aspect-ratio: auto; background: none; }
    .painel .retrato img { inset: -6% 0 0 0; height: 112%; opacity: .55; object-position: 70% 20%; }
    .painel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,16,19,.1), rgba(15,16,19,.92) 70%); }
    .resumo { position: relative; z-index: 2; align-self: end; padding: 0 var(--gutter); font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; color: var(--metal); line-height: 1.7; }
    .resumo b { color: var(--prata); font-weight: 500; display: block; }
    .resumo div { margin-top: 10px; border-top: 1px solid rgba(228,229,232,.1); padding-top: 8px; }
    .prog { position: relative; z-index: 2; display: flex; gap: 6px; padding: 28px var(--gutter) 0; }
    .prog i { flex: 1; height: 2px; background: rgba(228,229,232,.15); }
    .prog i.on { background: var(--prata); }
    .prog i.cur { background: var(--roxo); }
    .graf-painel { position: absolute; z-index: 2; left: var(--gutter); top: 18vh; width: 60%; opacity: 0; transition: opacity .6s; }
    .graf-painel.show { opacity: 1; }
    .lado { position: relative; overflow-y: auto; padding: 14vh var(--gutter) 10vh; display: grid; align-content: center; }
    .q { max-width: 620px; }
    .q h1 { font-size: clamp(1.7rem, 3.2vw, 2.7rem); }
    .q .n { display: block; margin-bottom: 18px; }
    .op { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 8px; }
    .op label { display: flex; align-items: center; gap: 14px; background: var(--superficie); padding: 15px 18px; cursor: pointer; border-radius: 2px; }
    .op label:has(:checked) { box-shadow: inset 0 0 0 2px var(--roxo); }
    .op input { accent-color: var(--roxo); width: 18px; height: 18px; margin: 0; }
    .op .k { font-family: var(--mono); font-size: .68rem; color: var(--metal); letter-spacing: .1em; width: 18px; }
    .op .outro { flex: 1; background: transparent; border: 0; border-bottom: 1px solid rgba(228,229,232,.25); color: var(--prata); font: inherit; padding: 4px 0; }
    .nav { display: flex; gap: 12px; margin-top: 34px; align-items: center; }
    .nav .dica { margin-left: auto; font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; color: var(--metal); }
    .check { display: flex; gap: 12px; align-items: flex-start; margin-top: 22px; font-size: .95rem; color: var(--metal); }
    .check input { accent-color: var(--roxo); width: 18px; height: 18px; margin-top: 3px; flex: none; }
    .sai { animation: sai .35s forwards; } .entra { animation: entra .35s; }
    @keyframes sai { to { opacity: 0; transform: translateY(-10px); } }
    @keyframes entra { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .sai, .entra { animation: none; } }
    /* resultado */
    .res h1 { font-size: clamp(1.9rem, 3.6vw, 3rem); }
    .res .bl { border-top: 1px solid rgba(228,229,232,.12); padding: 24px 0; }
    .res .bl h2 { font-size: 1.15rem; letter-spacing: -.01em; font-family: var(--texto); font-weight: 600; margin-bottom: 10px; }
    .res .bl p, .res .bl li { color: var(--metal); }
    .res ul { list-style: none; padding: 0; margin: 0; }
    .res li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; }
    .res li span { font-family: var(--mono); white-space: nowrap; color: var(--prata); }
    .res .num-g { font-family: var(--mono); font-size: 1.6rem; color: var(--prata); }
    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 30dvh 1fr; }
      .painel { padding-bottom: 16px; } .resumo { font-size: .7rem; line-height: 1.5; max-height: 14dvh; overflow: hidden; } .prog { padding-top: 72px; }
      .graf-painel { display: none; } .lado { padding: 24px var(--gutter) 40px; align-content: start; }
    }
  </style>
</head>
<body>
  <div class="split">
    <aside class="painel" aria-label="Resumo das respostas">
      <figure class="retrato"><img src="../assets/retrato.webp" alt="" loading="eager"></figure>
      <div class="prog" id="prog" aria-hidden="true"></div>
      <span class="graf graf--prata graf-painel" id="grafp" data-tag="tag-6" data-texto="MÃOS NA MÁQUINA"></span>
      <div class="resumo" id="resumo"><b>DIAGNÓSTICO</b><div>As suas respostas aparecem aqui.</div></div>
    </aside>
    <main class="lado" id="lado"><div class="q" id="q"></div></main>
  </div>

  <script src="../vendor/sound-engine.js"></script>
  <script src="../site.js"></script>
  <script>
    STEVE.header(); STEVE.sound([], { gain: 0.03 }); STEVE.parallax();
    const esc = STEVE.esc, ss = STEVE.ss;
    const Q = [
      { id: 'nome', t: 'Como você se chama?', tipo: 'texto', min: 2, max: 60, req: true, ph: 'Seu nome' },
      { id: 'empresa', t: 'Qual o nome da sua empresa?', tipo: 'texto', min: 1, max: 80, req: true, ph: 'Nome da empresa', extra: { id: 'url', label: 'Site ou Instagram (se tiver)', ph: '@ ou endereço' } },
      { id: 'segmento', t: 'O que a empresa faz?', tipo: 'uma', req: true, ops: ['Loja física', 'E-commerce / marketplace', 'Serviços (clínica, escritório, estúdio)', 'Indústria / fábrica', 'Distribuidora / atacado', 'Conteúdo / infoproduto', 'Outro'] },
      { id: 'porte', t: 'Quantas pessoas trabalham aí, contando você?', tipo: 'uma', req: true, ops: ['Só eu', '2–5', '6–20', '21–100', 'Mais de 100'] },
      { id: 'travas', t: 'Onde o dia trava? (até 3)', tipo: 'varias', req: true, max: 3, ops: ['Atendimento no WhatsApp', 'Cadastro e anúncio de produto', 'Planilha e lançamento manual', 'Nota fiscal e financeiro', 'Conteúdo e redes', 'Site e presença online', 'Relatórios', 'Outro'] },
      { id: 'programas', t: 'Quais programas vocês usam todo dia?', tipo: 'varias', req: false, ops: ['WhatsApp Business', 'Planilha', 'ERP (qual?)', 'Marketplace (qual?)', 'Instagram', 'Sistema próprio', 'Outro'] },
      { id: 'horas', t: 'Quantas horas por semana, somando a equipe, vão em tarefa repetitiva de tela?', tipo: 'horas', req: true },
      { id: 'pedido', t: 'Se o Steve resolvesse UMA coisa amanhã, qual seria?', tipo: 'longo', min: 10, max: 400, req: true, ph: 'Escreve do seu jeito' },
      { id: 'inicio', t: 'Quando você quer começar?', tipo: 'uma', req: true, ops: ['Esta semana', 'Este mês', 'Nos próximos 3 meses', 'Só pesquisando'] },
      { id: 'investimento', t: 'Que investimento faz sentido agora?', tipo: 'uma', req: true, ops: ['Até R$ 2.500', 'R$ 2.500 a 5.000', 'R$ 5.000 a 10.000', 'Acima de R$ 10.000', 'Prefiro ver a proposta'] },
      { id: 'whatsapp', t: 'Seu WhatsApp', tipo: 'contato', req: true },
    ];
    const N = Q.length;
    let R = {}; try { R = JSON.parse(ss.get('steve.diag') || '{}'); } catch (e) { R = {}; }
    if (!R.cliente_id) R.cliente_id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    if (R.horas == null && ss.get('steve.horas')) R.horas = Number(ss.get('steve.horas'));
    if (R.valor_hora == null && ss.get('steve.valorHora')) R.valor_hora = Number(ss.get('steve.valorHora'));
    if (!R.pedido && ss.get('steve.pedido')) R.pedido = ss.get('steve.pedido');
    let i = Number(ss.get('steve.diag.i') || 0); if (i >= N) i = N - 1;
    const save = () => { ss.set('steve.diag', JSON.stringify(R)); ss.set('steve.diag.i', String(i)); };
    const q = document.getElementById('q'), prog = document.getElementById('prog'), resumo = document.getElementById('resumo');
    prog.innerHTML = Q.map(() => '<i></i>').join('');
    const RES = { nome: 'Nome', empresa: 'Empresa', segmento: 'Faz', porte: 'Equipe', travas: 'Trava', programas: 'Usa', horas: 'Horas/sem', pedido: 'Primeiro', inicio: 'Começar', investimento: 'Investimento', whatsapp: 'WhatsApp' };
    function drawResumo() {
      const rows = Q.filter(x => R[x.id] != null && R[x.id] !== '' && !(Array.isArray(R[x.id]) && !R[x.id].length)).map(x => `<div><span>${RES[x.id]}</span><b data-decode>${esc(Array.isArray(R[x.id]) ? R[x.id].join(' · ') : String(R[x.id]).slice(0, 80))}</b></div>`).join('');
      resumo.innerHTML = `<b>DIAGNÓSTICO · ${i + 1}/${N}</b>${rows || '<div>As suas respostas aparecem aqui.</div>'}`;
      STEVE.decodeObserve(resumo);
      [...prog.children].forEach((e, k) => { e.className = k < i ? 'on' : k === i ? 'cur' : ''; });
    }
    function op(x, k, o, checked, tipo) {
      const isOutro = /^Outro|\(qual\?\)/.test(o);
      return `<li><label><input type="${tipo}" name="${x.id}" value="${esc(o)}" ${checked ? 'checked' : ''}><span class="k">${String.fromCharCode(65 + k)}</span><span>${esc(o)}</span>${isOutro ? `<input class="outro" name="${x.id}_outro" placeholder="qual?" maxlength="60" value="${esc(R[x.id + '_outro'] || '')}">` : ''}</label></li>`;
    }
    function render(dir) {
      const x = Q[i]; const v = R[x.id];
      let inner = `<span class="mono n">${String(i + 1).padStart(2, '0')} / ${N}${x.req ? '' : ' · OPCIONAL'}</span><h1>${esc(x.t)}</h1>`;
      if (x.tipo === 'texto') inner += `<label class="field"><span class="sr">${esc(x.t)}</span><input class="inp" id="in" name="${x.id}" maxlength="${x.max}" placeholder="${esc(x.ph)}" value="${esc(v || '')}" autocomplete="off"></label>` + (x.extra ? `<label class="field"><span>${esc(x.extra.label)}</span><input class="inp" name="${x.extra.id}" maxlength="120" placeholder="${esc(x.extra.ph)}" value="${esc(R[x.extra.id] || '')}"></label>` : '');
      if (x.tipo === 'longo') inner += `<label class="field"><span class="sr">${esc(x.t)}</span><textarea class="inp" id="in" name="${x.id}" maxlength="${x.max}" rows="4" placeholder="${esc(x.ph)}">${esc(v || '')}</textarea></label>`;
      if (x.tipo === 'uma') inner += `<ul class="op">${x.ops.map((o, k) => op(x, k, o, v === o, 'radio')).join('')}</ul>`;
      if (x.tipo === 'varias') inner += `<ul class="op">${x.ops.map((o, k) => op(x, k, o, (v || []).includes(o), 'checkbox')).join('')}</ul>`;
      if (x.tipo === 'horas') inner += `<label class="field"><span>Horas por semana <output class="num" id="hOut" style="margin-left:10px;color:var(--prata)">${Number(v ?? 12)} h</output></span><input class="range" type="range" id="in" name="horas" min="0" max="60" value="${Number(v ?? 12)}"></label><label class="field"><span>Quanto vale uma hora dessas? (opcional)</span><input class="inp" type="number" name="valor_hora" min="0" step="1" inputmode="numeric" placeholder="R$" value="${R.valor_hora ?? ''}"></label>`;
      if (x.tipo === 'contato') inner += `<label class="field"><span>WhatsApp</span><input class="inp" id="in" name="whatsapp" inputmode="tel" placeholder="+55 (16) 9XXXX-XXXX" autocomplete="tel" value="${esc(v || '')}"></label><label class="field"><span>E-mail (opcional)</span><input class="inp" type="email" name="email" placeholder="voce@empresa.com" autocomplete="email" value="${esc(R.email || '')}"></label><label class="check"><input type="checkbox" name="consentimento" ${R.consentimento ? 'checked' : ''}><span>Aceito ser contatado pelo WhatsApp sobre este diagnóstico. Posso sair quando quiser. <a href="../privacidade/" target="_blank" rel="noopener">Privacidade</a>.</span></label>`;
      inner += `<p class="err" id="err" aria-live="polite"></p><div class="nav">${i > 0 ? '<button class="btn btn--ghost" type="button" id="volta">Voltar</button>' : ''}<button class="btn ${i === N - 1 ? 'btn--roxo' : 'btn--prata'}" type="submit" id="vai">${i === N - 1 ? 'Ver meu diagnóstico' : 'Continuar'}</button><span class="dica">ENTER AVANÇA · ← VOLTA</span></div>`;
      const form = document.createElement('form'); form.noValidate = true; form.innerHTML = inner; form.className = STEVE.REDUCE ? '' : 'entra';
      q.innerHTML = ''; q.appendChild(form);
      const h1 = form.querySelector('h1'); STEVE.decodeNow(h1);
      const first = form.querySelector('#in') || form.querySelector('input'); if (first && innerWidth > 860) first.focus();
      form.addEventListener('submit', e => { e.preventDefault(); next(form); });
      if (form.querySelector('#volta')) form.querySelector('#volta').addEventListener('click', () => go(i - 1));
      if (x.tipo === 'horas') form.querySelector('#in').addEventListener('input', e => form.querySelector('#hOut').textContent = e.target.value + ' h');
      if (x.tipo === 'contato') form.querySelector('#in').addEventListener('input', e => { e.target.value = mask(e.target.value); });
      if (x.tipo === 'varias' && x.max) form.querySelectorAll('input[type=checkbox][name=' + x.id + ']').forEach(c => c.addEventListener('change', () => { const on = [...form.querySelectorAll('input[type=checkbox][name=' + x.id + ']:checked')]; if (on.length > x.max) { c.checked = false; form.querySelector('#err').textContent = 'Até ' + x.max + ' opções.'; } else form.querySelector('#err').textContent = ''; }));
      form.addEventListener('change', e => { if (e.target.type === 'radio' || e.target.type === 'checkbox') STEVE.fire('type'); });
      drawResumo();
    }
    const mask = s => { const d = s.replace(/\D/g, '').replace(/^55/, '').slice(0, 11); let o = '+55'; if (d.length) o += ' (' + d.slice(0, 2); if (d.length >= 2) o += ') '; if (d.length > 2) o += d.slice(2, 7); if (d.length > 7) o += '-' + d.slice(7, 11); return d.length ? o : s ? '+55 ' : ''; };
    function read(form) {
      const x = Q[i], err = form.querySelector('#err'); const fd = new FormData(form);
      const bad = m => { err.textContent = m; STEVE.fire('crack'); return false; };
      if (x.tipo === 'texto' || x.tipo === 'longo') { const v = String(fd.get(x.id) || '').trim(); if (x.req && v.length < x.min) return bad(x.tipo === 'longo' ? 'Escreve um pouco mais: pelo menos 10 letras.' : 'Precisa de pelo menos ' + x.min + ' letras.'); R[x.id] = v; if (x.extra) R[x.extra.id] = String(fd.get(x.extra.id) || '').trim(); }
      if (x.tipo === 'uma') { const v = fd.get(x.id); if (x.req && !v) return bad('Escolhe uma opção.'); R[x.id] = v; R[x.id + '_outro'] = String(fd.get(x.id + '_outro') || '').trim(); }
      if (x.tipo === 'varias') { const v = fd.getAll(x.id); if (x.req && !v.length) return bad('Escolhe pelo menos uma.'); R[x.id] = v; R[x.id + '_outro'] = String(fd.get(x.id + '_outro') || '').trim(); }
      if (x.tipo === 'horas') { R.horas = Math.min(60, Math.max(0, Number(fd.get('horas')) || 0)); const vh = Number(fd.get('valor_hora')); R.valor_hora = vh > 0 ? vh : null; }
      if (x.tipo === 'contato') { const d = String(fd.get('whatsapp') || '').replace(/\D/g, '').replace(/^55/, ''); if (d.length !== 11) return bad('Esse WhatsApp parece incompleto: são 11 números com o DDD.'); R.whatsapp = '+55' + d; R.email = String(fd.get('email') || '').trim(); if (!fd.get('consentimento')) return bad('Precisamos do seu aceite para falar com você.'); R.consentimento = true; }
      return true;
    }
    function go(k) { const form = q.firstElementChild; if (form && !STEVE.REDUCE) { form.classList.add('sai'); setTimeout(() => { i = k; save(); render(); }, 320); } else { i = k; save(); render(); } STEVE.fire('whoosh'); }
    function next(form) { if (!read(form)) return; save(); if (i < N - 1) go(i + 1); else enviar(); }
    addEventListener('keydown', e => { if (e.key === 'ArrowLeft' && i > 0 && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) go(i - 1); });

    // pontuação (§10)
    function score(r) { const u = { 'Esta semana': 40, 'Este mês': 25, 'Nos próximos 3 meses': 10, 'Só pesquisando': 0 }[r.inicio] || 0; const inv = { 'Acima de R$ 10.000': 30, 'R$ 5.000 a 10.000': 25, 'R$ 2.500 a 5.000': 20, 'Até R$ 2.500': 10, 'Prefiro ver a proposta': 15 }[r.investimento] || 0; const p = { 'Mais de 100': 20, '21–100': 18, '6–20': 15, '2–5': 10, 'Só eu': 5 }[r.porte] || 0; return u + inv + p + (r.horas >= 20 ? 10 : 5); }
    async function enviar() {
      q.innerHTML = '<div class="res"><span class="mono n">ENVIANDO</span><h1 data-decode>Montando o seu diagnóstico.</h1></div>'; STEVE.decodeObserve(q);
      let cfg = {}; try { cfg = await STEVE.json('config.json'); } catch (e) { }
      const origem = {}; try { new URL(location.href).searchParams.forEach((v, k) => { if (/^utm_/.test(k)) origem[k] = v.slice(0, 80); }); if (document.referrer) origem.referrer = document.referrer.slice(0, 200); } catch (e) { }
      const payload = { cliente_id: R.cliente_id, nome: R.nome, empresa: R.empresa, url: R.url || null, segmento: R.segmento === 'Outro' && R.segmento_outro ? 'Outro: ' + R.segmento_outro : R.segmento, porte: R.porte, travas: (R.travas || []).map(t => t === 'Outro' && R.travas_outro ? 'Outro: ' + R.travas_outro : t), programas: (R.programas || []).map(t => /Outro|qual/.test(t) && R.programas_outro ? t + ': ' + R.programas_outro : t), horas_semana: R.horas, valor_hora: R.valor_hora, pedido: R.pedido, inicio: R.inicio, investimento: R.investimento, whatsapp: R.whatsapp, email: R.email || null, consentimento: true, origem };
      let res = null, falhou = false;
      if (cfg.fn_diagnostico) {
        try { const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 9000);
          const r = await fetch(cfg.fn_diagnostico, { method: 'POST', headers: { 'content-type': 'application/json', apikey: cfg.anon_key || '' }, body: JSON.stringify(payload), signal: ctrl.signal }); clearTimeout(to);
          if (r.ok) res = await r.json(); else falhou = true; } catch (e) { falhou = true; }
      } else falhou = true;
      if (!res) { const est = await STEVE.estimarLocal(R.pedido); res = { servicos: est.servicos, porte: est.porte, total: est.total, score: score(R), via: 'local' }; }
      resultado(res, falhou, cfg);
    }
    function resultado(res, falhou, cfg) {
      const H = (R.horas || 0) * 48; const val = R.valor_hora ? STEVE.brl(H * R.valor_hora) : null;
      const s1 = res.servicos[0]; const wa = (cfg.whatsapp_casa || '').replace(/\D/g, '');
      const msg = `Oi! Sou ${R.nome}, da ${R.empresa}. Acabei de fazer o diagnóstico no site do Steve e quero conversar sobre ${s1 ? s1.nome : 'o que o Steve faria primeiro'}.`;
      const waLink = wa ? `https://wa.me/${wa}?text=${encodeURIComponent(msg)}` : null;
      let ck = null; STEVE.json('checkout.json').then(c => { if (s1 && c[s1.id]) { ck = c[s1.id]; const b = document.getElementById('ck'); if (b) { b.href = ck; b.classList.remove('hide'); } } }).catch(() => { });
      const grande = res.porte === 'grande';
      q.innerHTML = `<div class="res">
        <span class="mono n">RESULTADO</span>
        <h1 data-decode>${esc(R.nome)}, o seu diagnóstico.</h1>
        <div class="bl" style="margin-top:28px"><h2>Onde a ${esc(R.empresa)} perde tempo</h2>
          <p>${(R.travas || []).map(esc).join(' · ')}.</p>
          <p style="margin-top:10px"><span class="num-g" data-decode>${H.toLocaleString('pt-BR')} horas por ano</span><br>${R.horas} h por semana em tarefa repetitiva de tela, 48 semanas úteis${val ? `. <span class="num-g" data-decode>${val}</span> por ano em clique repetido` : ''}.</p></div>
        <div class="bl"><h2>O que o Steve faria primeiro</h2>
          ${res.servicos.length ? `<ul>${res.servicos.slice(0, 3).map(s => `<li><b style="color:var(--prata)">${esc(s.nome)}</b><span>${s.preco ? (grande ? 'a partir de ' : '') + STEVE.brl(s.preco) : 'sob consulta'}</span></li>`).join('')}</ul><p style="margin-top:10px">${grande ? 'Escopo grande: proposta final na conversa.' : 'Preço pela escada. Proposta final na conversa.'}</p>` : '<p>Vamos entender melhor na conversa: o pedido não bateu com um serviço do catálogo.</p>'}
          <p style="margin-top:10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em">"${esc(R.pedido)}"</p></div>
        <div class="bl"><h2>Próximo passo</h2>
          <p>${falhou ? 'Não conseguimos enviar agora. Suas respostas estão salvas: tente de novo ou chame no WhatsApp.' : 'Seu diagnóstico chegou para a equipe. Em até 1 dia útil falamos com você no WhatsApp.'}</p>
          <div class="ctas">${waLink ? `<a class="btn btn--roxo" id="wa" href="${waLink}" target="_blank" rel="noopener">Falar agora no WhatsApp</a>` : '<span class="mono">WHATSAPP DA CASA AINDA NÃO CONFIGURADO</span>'}
            <a class="btn btn--ghost hide" id="ck" href="#">Garantir o 1º serviço</a>
            ${falhou ? '<button class="btn btn--ghost" id="retry" type="button">Tentar de novo</button>' : `<a class="btn btn--ghost" href="../obrigado/">Receber no WhatsApp</a>`}</div></div>
      </div>`;
      STEVE.decodeObserve(q); STEVE.fire('flare');
      document.getElementById('grafp').classList.add('show');
      const rt = document.getElementById('retry'); if (rt) rt.addEventListener('click', enviar);
      if (!falhou) { ss.set('steve.diag.enviado', '1'); ss.set('steve.diag.wa', waLink || ''); }
      window.__diag = { res, R, waLink };
    }
    STEVE.graffiti().then(() => { const g = document.getElementById('grafp'); if (g.__rect) g.__rect.setAttribute('width', g.__w); });
    render();
  </script>
</body>
